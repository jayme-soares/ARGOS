<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0f1720">
  <title>ARGOS · Religações</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23e8b64c'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%230f1720'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- LOGIN -->
  <main id="tela-login" class="login" hidden>
    <form id="form-login" class="login-card" autocomplete="on">
      <div class="marca marca-grande">
        <span class="olho" aria-hidden="true"></span>
        <div>
          <strong>ARGOS</strong>
          <small>Religações · Maricá</small>
        </div>
      </div>
      <label>Email
        <input id="login-email" name="email" type="email" autocomplete="username" required>
      </label>
      <label>Senha
        <input id="login-senha" name="password" type="password" autocomplete="current-password" required>
      </label>
      <button type="submit" class="btn-primario">Entrar</button>
      <p id="login-erro" class="login-erro" role="alert"></p>
      <p class="login-dica">Use o mesmo email e senha dos sistemas da empresa. No primeiro acesso, um administrador precisa aprovar sua entrada.</p>
    </form>
  </main>

  <!-- AGUARDANDO APROVAÇÃO / RECUSADO -->
  <main id="tela-espera" class="login" hidden>
    <div class="login-card">
      <div class="marca marca-grande">
        <span class="olho" aria-hidden="true"></span>
        <div>
          <strong>ARGOS</strong>
          <small>Religações · Maricá</small>
        </div>
      </div>
      <h2 id="espera-titulo" class="espera-titulo"></h2>
      <p id="espera-texto" class="espera-texto"></p>
      <p class="secundario">Conectado como <b id="espera-email"></b></p>
      <button id="btn-verificar" class="btn-primario">Verificar novamente</button>
      <button id="btn-sair-espera" class="btn-texto">Sair</button>
    </div>
  </main>

  <!-- PAINEL -->
  <div id="tela-painel" hidden>
    <header class="topo">
      <div class="marca">
        <span class="olho" aria-hidden="true"></span>
        <div>
          <strong>ARGOS</strong>
          <small>Religações · Maricá</small>
        </div>
      </div>
      <div class="status" id="status"></div>
      <div class="acoes-topo">
        <button id="btn-atualizar" class="btn-icone" title="Atualizar agora" aria-label="Atualizar agora">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        </button>
        <button id="btn-tema" class="btn-icone" title="Alternar tema" aria-label="Alternar tema">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg>
        </button>
        <span id="usuario-atual" class="usuario-atual"></span>
        <button id="btn-sair" class="btn-texto">Sair</button>
      </div>
    </header>

    <section id="extracao" class="extracao" aria-label="Extração dos dados de campo" hidden></section>

    <div id="avisos" class="avisos"></div>

    <section class="kpis" id="kpis" aria-label="Indicadores"></section>

    <nav class="abas" role="tablist">
      <button role="tab" data-aba="campo" class="aba">Em campo <span class="contador" id="cont-campo">0</span></button>
      <button role="tab" data-aba="programaveis" class="aba">Programáveis <span class="contador" id="cont-programaveis">0</span></button>
      <button role="tab" data-aba="equipes" class="aba">Por equipe <span class="contador" id="cont-equipes">0</span></button>
      <button role="tab" data-aba="acessos" class="aba" id="aba-acessos" hidden>Acessos <span class="contador" id="cont-acessos">0</span></button>
    </nav>

    <section class="filtros" id="filtros">
      <div class="busca">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="filtro-texto" type="search" placeholder="Buscar ordem, TdC, cliente, endereço…">
      </div>
      <select id="filtro-equipe" aria-label="Filtrar por equipe"><option value="">Todas as equipes</option></select>
      <select id="filtro-bairro" aria-label="Filtrar por bairro"><option value="">Todos os bairros</option></select>
      <div class="chips" id="filtro-urgencia" role="group" aria-label="Filtrar por urgência">
        <button data-urg="" class="chip">Todas</button>
        <button data-urg="vencida" class="chip chip-vencida">Vencidas</button>
        <button data-urg="critico" class="chip chip-critico">≤ 30 min</button>
        <button data-urg="alerta" class="chip chip-alerta">≤ 1h</button>
        <button data-urg="atencao" class="chip chip-atencao">≤ 2h</button>
      </div>
    </section>

    <section class="tabela-wrap">
      <table class="tabela" id="tabela">
        <thead id="tabela-cabecalho"></thead>
        <tbody id="tabela-corpo"></tbody>
      </table>
      <p class="vazio" id="vazio" hidden></p>
    </section>

    <footer class="rodape">
      <span id="rodape-info"></span>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
