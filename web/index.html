<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0f1720">
  <title>ARGOS · Religações</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icones/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ARGOS">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Syne:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Símbolo do ARGOS (design "ARGOS — Logo"): pontos na cor do texto, centro na cor da marca. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="argos-simbolo" viewBox="0 50 200 100">
      <g fill="currentColor"><circle cx="14.00" cy="100.00" r="0.92"/><circle cx="28.10" cy="91.72" r="1.18"/><circle cx="28.10" cy="108.28" r="1.18"/><circle cx="38.29" cy="81.80" r="1.36"/><circle cx="38.29" cy="118.20" r="1.36"/><circle cx="43.15" cy="93.11" r="1.44"/><circle cx="43.15" cy="106.89" r="1.44"/><circle cx="51.86" cy="79.06" r="1.58"/><circle cx="51.86" cy="120.94" r="1.58"/><circle cx="58.43" cy="68.80" r="1.67"/><circle cx="58.43" cy="131.20" r="1.67"/><circle cx="61.65" cy="91.79" r="1.72"/><circle cx="61.65" cy="108.21" r="1.72"/><circle cx="64.20" cy="79.51" r="1.75"/><circle cx="64.20" cy="120.49" r="1.75"/><circle cx="72.73" cy="68.53" r="1.86"/><circle cx="72.73" cy="131.47" r="1.86"/><circle cx="75.60" cy="88.23" r="2.80"/><circle cx="75.60" cy="111.77" r="2.80"/><circle cx="85.15" cy="70.02" r="2.00"/><circle cx="85.15" cy="129.98" r="2.00"/><circle cx="87.78" cy="58.21" r="2.02"/><circle cx="87.78" cy="141.79" r="2.02"/><circle cx="88.93" cy="84.49" r="2.80"/><circle cx="88.93" cy="115.51" r="2.80"/><circle cx="100.00" cy="62.20" r="2.10"/><circle cx="100.00" cy="74.20" r="2.80"/><circle cx="100.00" cy="125.80" r="2.80"/><circle cx="100.00" cy="137.80" r="2.10"/><circle cx="111.07" cy="84.49" r="2.80"/><circle cx="111.07" cy="115.51" r="2.80"/><circle cx="112.22" cy="58.21" r="2.02"/><circle cx="112.22" cy="141.79" r="2.02"/><circle cx="114.85" cy="70.02" r="2.00"/><circle cx="114.85" cy="129.98" r="2.00"/><circle cx="124.40" cy="88.23" r="2.80"/><circle cx="124.40" cy="111.77" r="2.80"/><circle cx="127.27" cy="68.53" r="1.86"/><circle cx="127.27" cy="131.47" r="1.86"/><circle cx="135.80" cy="79.51" r="1.75"/><circle cx="135.80" cy="120.49" r="1.75"/><circle cx="138.35" cy="91.79" r="1.72"/><circle cx="138.35" cy="108.21" r="1.72"/><circle cx="141.57" cy="68.80" r="1.67"/><circle cx="141.57" cy="131.20" r="1.67"/><circle cx="148.14" cy="79.06" r="1.58"/><circle cx="148.14" cy="120.94" r="1.58"/><circle cx="156.85" cy="93.11" r="1.44"/><circle cx="156.85" cy="106.89" r="1.44"/><circle cx="161.71" cy="81.80" r="1.36"/><circle cx="161.71" cy="118.20" r="1.36"/><circle cx="171.90" cy="91.72" r="1.18"/><circle cx="171.90" cy="108.28" r="1.18"/><circle cx="186.00" cy="100.00" r="0.92"/><circle cx="119.00" cy="100.00" r="2.80"/><circle cx="81.00" cy="100.00" r="2.80"/><circle cx="129.50" cy="100.00" r="2.80"/><circle cx="70.50" cy="100.00" r="2.80"/><circle cx="144.50" cy="100.00" r="1.63"/><circle cx="55.50" cy="100.00" r="1.63"/><circle cx="164.50" cy="100.00" r="1.31"/><circle cx="35.50" cy="100.00" r="1.31"/></g>
      <circle cx="100" cy="100" r="9" style="fill: var(--marca)"/>
    </symbol>
  </svg>
  <!-- LOGIN -->
  <main id="tela-login" class="login" hidden>
    <form id="form-login" class="login-card" autocomplete="on">
      <div class="marca marca-grande">
        <svg class="simbolo" aria-hidden="true"><use href="#argos-simbolo"/></svg>
        <div>
          <strong>ARGOS</strong>
          <small>Religações · Maricá</small>
        </div>
      </div>
      <label data-so-cadastro hidden>Nome
        <input id="login-nome" name="name" type="text" autocomplete="name" required disabled>
      </label>
      <label>Email
        <input id="login-email" name="email" type="email" autocomplete="username" required>
      </label>
      <label>Senha
        <input id="login-senha" name="password" type="password" autocomplete="current-password" required>
      </label>
      <label data-so-cadastro hidden>Confirme a senha
        <input id="login-senha2" name="password2" type="password" autocomplete="new-password" minlength="6" required disabled>
      </label>
      <button id="btn-login" type="submit" class="btn-primario">Entrar</button>
      <p id="login-erro" class="login-erro" role="alert"></p>
      <p id="login-dica" class="login-dica"></p>
      <button id="btn-alternar-cadastro" type="button" class="btn-link"></button>
    </form>
  </main>

  <!-- AGUARDANDO APROVAÇÃO / RECUSADO -->
  <main id="tela-espera" class="login" hidden>
    <div class="login-card">
      <div class="marca marca-grande">
        <svg class="simbolo" aria-hidden="true"><use href="#argos-simbolo"/></svg>
        <div>
          <strong>ARGOS</strong>
          <small>Religações · Maricá</small>
        </div>
      </div>
      <h2 id="espera-titulo" class="espera-titulo"></h2>
      <p id="espera-texto" class="espera-texto"></p>
      <p class="secundario">Conectado como <b id="espera-email"></b></p>
      <button id="btn-verificar" class="btn-primario">Verificar novamente</button>
      <button id="btn-sair-espera" class="btn-texto">Sair</button>
    </div>
  </main>

  <!-- PAINEL -->
  <div id="tela-painel" hidden>
    <header class="topo">
      <div class="marca">
        <svg class="simbolo" aria-hidden="true"><use href="#argos-simbolo"/></svg>
        <div>
          <strong>ARGOS</strong>
          <small>Religações · Maricá</small>
        </div>
      </div>
      <div class="status" id="status"></div>
      <div class="acoes-topo">
        <button id="btn-atualizar" class="btn-icone" title="Atualizar agora" aria-label="Atualizar agora">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        </button>
        <button id="btn-push" class="btn-icone" title="Ativar notificações" aria-label="Ativar notificações" aria-pressed="false" hidden>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/><path class="risco" d="M3 3l18 18"/></svg>
        </button>
        <button id="btn-tema" class="btn-icone" title="Alternar tema" aria-label="Alternar tema">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg>
        </button>
        <span id="usuario-atual" class="usuario-atual"></span>
        <button id="btn-sair" class="btn-texto">Sair</button>
      </div>
    </header>

    <section id="extracao" class="extracao" aria-label="Extração dos dados de campo" hidden></section>

    <div id="avisos" class="avisos"></div>

    <section class="kpis" id="kpis" aria-label="Indicadores"></section>

    <nav class="abas" role="tablist">
      <button role="tab" data-aba="campo" class="aba">Em campo <span class="contador" id="cont-campo">0</span></button>
      <button role="tab" data-aba="programaveis" class="aba">Programáveis <span class="contador" id="cont-programaveis">0</span></button>
      <button role="tab" data-aba="finalizadas" class="aba" title="Finalizadas hoje">Finalizadas <span class="contador" id="cont-finalizadas">0</span></button>
      <button role="tab" data-aba="equipes" class="aba">Por equipe <span class="contador" id="cont-equipes">0</span></button>
      <button role="tab" data-aba="acessos" class="aba" id="aba-acessos" hidden>Acessos <span class="contador" id="cont-acessos">0</span></button>
    </nav>

    <section class="filtros" id="filtros">
      <div class="busca">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="filtro-texto" type="search" placeholder="Buscar ordem, TdC, cliente, endereço…">
      </div>
      <select id="filtro-equipe" aria-label="Filtrar por equipe"><option value="">Todas as equipes</option></select>
      <select id="filtro-bairro" aria-label="Filtrar por bairro"><option value="">Todos os bairros</option></select>
      <div class="chips" id="filtro-urgencia" role="group" aria-label="Filtrar por urgência">
        <button data-urg="" class="chip">Todas</button>
        <button data-urg="vencida" class="chip chip-vencida">Vencidas</button>
        <button data-urg="critico" class="chip chip-critico">≤ 30 min</button>
        <button data-urg="alerta" class="chip chip-alerta">≤ 1h</button>
        <button data-urg="atencao" class="chip chip-atencao">≤ 2h</button>
      </div>
      <div class="chips" id="filtro-periodo" role="group" aria-label="Período das finalizadas" hidden>
        <button data-periodo="hoje" class="chip">Hoje</button>
        <button data-periodo="" class="chip">Últimos 7 dias</button>
      </div>
      <button id="btn-exportar" class="btn-texto btn-exportar" title="Baixar relatório (Excel) das ordens exibidas">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
        Exportar relatório
      </button>
    </section>

    <section class="tabela-wrap">
      <table class="tabela" id="tabela">
        <thead id="tabela-cabecalho"></thead>
        <tbody id="tabela-corpo"></tbody>
      </table>
      <p class="vazio" id="vazio" hidden></p>
    </section>

    <footer class="rodape">
      <span id="rodape-info"></span>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
